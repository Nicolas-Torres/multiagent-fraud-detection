name: CI

# Orden fijado en el contrato (§1.6): lint -> pytest -> check_policies ->
# export_data_model_diagram --check -> alembic upgrade head -> alembic check
# -> build -> push a GHCR. Dos jobs, mismo workflow: `build` sólo arranca si
# `test` pasa (`needs:`), que es como GitHub Actions expresa esa secuencia.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Sólo lo usan los dos últimos pasos (alembic). Es un Postgres efímero
    # del propio job, nunca la base real — así el gate de PR no depende de
    # si Azure/Neon son alcanzables desde el runner.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://fraud:fraud@localhost:5432/fraud

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar Python 3.12
        run: uv python install 3.12

      - name: "Instalar dependencias (--frozen: el lockfile manda, nunca se resuelve de nuevo)"
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest

      - name: check_policies (7000/7000 contra el ground truth)
        run: uv run python scripts/check_policies.py

      - name: export_data_model_diagram --check (modelo sin diagrama)
        run: uv run python scripts/export_data_model_diagram.py --check

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (modelo sin migración)
        run: uv run alembic check

  build:
    name: build-and-push
    needs: test
    # Regla de ADR-0008: un PR no publica ningún tag. `test` ya corrió y
    # validó el código; construir y empujar la imagen no aporta nada más
    # sobre un commit que todavía puede cambiar.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: "Calcular tags (ADR-0008: sha-<7> en main; X.Y.Z, X.Y, sha-<7> en tag de git; nunca latest)"
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha_tag="${image}:sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            major_minor="${version%.*}"
            tags="${image}:${version},${image}:${major_minor},${sha_tag}"
          else
            tags="${sha_tag}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build y push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Resumen — el digest es la referencia real, los tags son legibles (ADR-0008)
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "\`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Tags: \`${{ steps.tags.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

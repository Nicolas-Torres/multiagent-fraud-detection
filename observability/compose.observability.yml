# Stack local de observabilidad de infra (ADR-0024). No forma parte del
# `docker compose up -d` de siempre a propósito — es peso extra que nadie
# necesita para trabajar en el resto del proyecto. Se levanta aparte:
#
#   docker compose -f compose.yml -f observability/compose.observability.yml up -d
#
# La API corre en el host (`uv run uvicorn ...`), no en este compose —
# Alloy la scrapea vía `host.docker.internal`.
services:
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: fraud-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "4317:4317"   # OTLP gRPC — la app pushea acá (OTEL_EXPORTER_OTLP_ENDPOINT)
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # UI/debug de Alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fraud-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: fraud-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # query API, Grafana la consulta desde el host también

  loki:
    image: grafana/loki:3.2.1
    container_name: fraud-loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fraud-grafana
    environment:
      # Sólo local: cero fricción de login para iterar rápido. Si esto se
      # lleva a producción algún día, esta parte no viaja — ver ADR-0024.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

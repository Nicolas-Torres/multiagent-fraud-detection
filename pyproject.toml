[project]
name = "multiagent-fraud-detection"
version = "0.1.0"
description = "Analiza transacciones financieras con señales ambiguas (montos inusuales, horarios atípicos, dispositivos desconocidos) y produce una decisión trazable: APPROVE, CHALLENGE, BLOCK o ESCALATE_TO_HUMAN."
readme = "README.md"
authors = [
    { name = "Nicolas Torres", email = "ntorresv.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.18",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
multiagent-fraud-detection = "multiagent_fraud_detection:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
]
eval = [
    "deepeval>=4.1.5",
]

[tool.uv]
# `eval` es deuda de ADR-0013, no parte del entorno por defecto: instalarlo
# junto con `dev` inflaría cada `uv sync` con la cadena de `deepeval` (grpcio,
# openai, telemetría de posthog) para un script que nadie corre en CI. Opt-in
# explícito: `uv sync --group eval` o `uv run --group eval scripts/eval_golden_set.py`.
default-groups = ["dev"]

[tool.pytest.ini_options]
# `src` para el paquete, `tests` para que los módulos de test se importen entre
# sí (`from conftest import utc`). Sin esto haría falta instalar el paquete en
# modo editable antes de correr la suite.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
# Los nodos del grafo son `async def`; sin esto pytest los saltea en silencio.
asyncio_mode = "auto"

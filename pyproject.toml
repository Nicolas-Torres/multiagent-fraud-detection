[project]
name = "multiagent-fraud-detection"
version = "0.1.0"
description = "Analiza transacciones financieras con señales ambiguas (montos inusuales, horarios atípicos, dispositivos desconocidos) y produce una decisión trazable: APPROVE, CHALLENGE, BLOCK o ESCALATE_TO_HUMAN."
readme = "README.md"
authors = [
    { name = "Nicolas Torres", email = "ntorresv.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.18",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
multiagent-fraud-detection = "multiagent_fraud_detection:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.6",
]
eval = [
    "deepeval>=4.1.5",
]

[tool.uv]
# `eval` es deuda de ADR-0013, no parte del entorno por defecto: instalarlo
# junto con `dev` inflaría cada `uv sync` con la cadena de `deepeval` (grpcio,
# openai, telemetría de posthog) para un script que nadie corre en CI. Opt-in
# explícito: `uv sync --group eval` o `uv run --group eval scripts/eval_golden_set.py`.
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
# Autogeneradas por Alembic y, una vez aplicadas, historial inmutable
# (ADR-0009: "el esquema avanza sólo hacia adelante") — relintearlas
# retroactivamente reescribiría un artefacto que ya corrió contra una base
# real, por una modernización cosmética sin ganancia.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F",     # pycodestyle + pyflakes, la base
    "I",          # imports ordenados
    "UP",         # modernización (py312)
    "B",          # bugbear: atrapa footguns reales (closures sobre variable de loop, etc.)
    "C4",         # comprehensions innecesarias
    "DTZ",        # nada de datetime naive — coherente con la disciplina as-of del proyecto
    "BLE",        # nada de `except Exception` sin justificar
    "PYI",
    "FURB",
    "RUF",
    "SIM",
]
ignore = [
    "UP046",  # PEP 695 (`class Page[T]`) — Pydantic Generic con esa sintaxis no se probó, no vale el riesgo por un solo caso
    "SIM117", # `with` anidados: más legible que combinarlos cuando hay un docstring/comentario entre medio
    "E501",   # el proyecto prefiere una línea de prosa completa a cortarla a la fuerza
    "RUF001", "RUF002", "RUF003",  # falsos positivos en un codebase en español: ×, tildes, ¿¡— no son "ambiguos" acá
    "C408",   # dict(campo=valor, ...) es más legible que el literal con comillas cuando hay muchos campos nombrados
]

[tool.ruff.lint.per-file-ignores]
# Generador determinista offline (ADR-0003): los datetimes naive son
# consistentes entre sí dentro del propio dataset, nunca se mezclan con
# datetimes conscientes de zona.
"scripts/generate_data.py" = ["DTZ001", "DTZ007"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en un default de FastAPI es el patrón, no un bug: B008 sin
# esto marca cada endpoint del proyecto.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Security",
]

[tool.pytest.ini_options]
# `src` para el paquete, `tests` para que los módulos de test se importen entre
# sí (`from conftest import utc`). Sin esto haría falta instalar el paquete en
# modo editable antes de correr la suite.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
# Los nodos del grafo son `async def`; sin esto pytest los saltea en silencio.
asyncio_mode = "auto"
